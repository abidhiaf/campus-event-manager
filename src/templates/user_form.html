{% extends "base.html" %}
{% block title %}{{ 'Edit' if mode == 'edit' else 'New' }} user - Campus Event Manager{% endblock %}
{% block content %}

<h1 class="mb-4">{{ 'Edit user' if mode == 'edit' else 'New user' }}</h1>

<form method="post" class="row g-3" style="max-width: 640px;">
  <div class="col-md-6">
    <label class="form-label">First name</label>
    <input type="text" name="firstName" class="form-control" value="{{ user.firstName if user else '' }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Last name</label>
    <input type="text" name="lastName" class="form-control" value="{{ user.lastName if user else '' }}" required>
  </div>

  <div class="col-12">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" value="{{ user.email if user else '' }}" required>
  </div>

  <div class="col-md-6">
    <label class="form-label">Department</label>
    <input type="text" name="department" class="form-control" value="{{ user.department if user else '' }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Role</label>
    <input type="text" name="role" class="form-control" value="{{ user.role if user else '' }}" placeholder="student, staff, professor" required>
  </div>

  <div class="col-12">
    <label class="form-label">Interests (comma-separated)</label>
    <input type="text" name="interests" class="form-control" value="{{ user.interests if user else '' }}" placeholder="data science, robotics">
  </div>

  <div class="col-12 mt-4">
    <button type="submit" class="btn btn-primary">{{ 'Save changes' if mode == 'edit' else 'Create user' }}</button>
    <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>

{% endblock %}
